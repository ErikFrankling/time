# Server deployment for the homelab k3s cluster.
#
# The secret is NOT in this file and must never be. Create it out of band:
#
#   kubectl -n homelab create secret generic time-secrets \
#     --from-literal=api-key='<opencode key>' \
#     --from-literal=ingest-token="$(openssl rand -hex 32)"
#
# The Traefik route lives in homelab ingress/routes.yaml, alongside the others.
# See README.md for the full walkthrough.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: time-data
  annotations:
    # The database is the only thing that can't be reconstructed. Keep Flux
    # (and anything else doing a prune) away from it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-config
data:
  config.toml: |
    # Only the [server] section is read here. Agents keep their own config.
    [server]
    categories = [
      "work_neptune",
      "work_husk",
      "work_personal",
      "kth",
      "comms",
      "browsing",
      "youtube",
      "twitter",
      "idle",
      "other",
    ]
    model = "qwen3.6-plus"
    endpoint = "https://opencode.ai/zen/go/v1/chat/completions"
    port = 7373
    idle_distance = 3
    idle_after_secs = 300
    # One call per minute per device does not fit a weekly allowance shared
    # with real coding. Twenty minutes share one system prompt, and the label
    # lands within ten minutes of the minute it describes.
    batch_minutes = 20
    batch_wait_secs = 600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: time
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: time
  strategy:
    # SQLite on a ReadWriteOnce volume: never two writers at once.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: time
    spec:
      automountServiceAccountToken: false
      containers:
        - name: time
          image: ghcr.io/erikfrankling/time:latest
          imagePullPolicy: Always
          args: ["server"]
          env:
            - name: TIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: time-secrets
                  key: api-key
            # The server pulls the Android APK from this repo's GitHub
            # releases hourly and serves it at /app, so it needs outbound
            # HTTPS to api.github.com and objects.githubusercontent.com. The
            # default is this repo; TIME_APK_PATH would pin a file instead and
            # switch fetching off.
            - name: TIME_APK_REPO
              value: ErikFrankling/time
            # Typst writes a font/package cache; without this it tries $HOME.
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: TZ
              value: Europe/Stockholm
          ports:
            - containerPort: 7373
              name: http
              protocol: TCP
          # /healthz answers from the accept loop and touches neither the
          # database nor the model. The dashboard renders in about 20ms and
          # would usually do, but "usually" is what took the route away last
          # time: a probe should report whether the process can answer, not
          # queue behind whatever else it is answering.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /config
              name: config
              readOnly: true
            # The root filesystem is read-only, but rendering a PDF means
            # writing a Typst source file and its SVGs somewhere first. A
            # tmpfs keeps that posture rather than trading it away, and the
            # scratch files are meant to be transient anyway.
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: time-data
        - name: config
          configMap:
            name: time-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: time
spec:
  selector:
    app.kubernetes.io/name: time
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
