# Server deployment for the homelab k3s cluster.
#
# The secret is NOT in this file and must never be. Create it out of band:
#
#   kubectl -n homelab create secret generic time-secrets \
#     --from-literal=api-key='<key, or empty — the local llama-swap needs none>' \
#     --from-literal=ingest-token="$(openssl rand -hex 32)"
#
# The api-key entry is optional now that classification runs against the local
# llama-swap endpoint; it only matters again if the endpoint below points back
# at a hosted gateway.
#
# The Traefik route lives in homelab ingress/routes.yaml, alongside the others.
# See README.md for the full walkthrough.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: time-data
  annotations:
    # The database and the kept screenshots can't be reconstructed. Keep Flux
    # (and anything else doing a prune) away from them.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Screenshots are now kept forever under frames/ (roughly 50-100 KiB a
      # minute, so tens of GiB a year). This number stays at its historical
      # value on purpose: local-path never enforces capacity — the real limit
      # is the node's 160 GiB disk — and the storage class does not support
      # expansion, so changing this field on the bound claim makes every Flux
      # apply of this file error out. Growing it for real means recreating the
      # claim and moving the data by hand; until then the value is cosmetic.
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-config
data:
  config.toml: |
    # Only the [server] section is read here. Agents keep their own config.
    [server]
    categories = [
      "work_neptune",
      "work_husk",
      "work_personal",
      "kth",
      # Messaging: Discord, Signal, Slack, mail. Named for what it is, since
      # a one-word category nobody chose is a category nobody trusts.
      "comms",
      # Spotify and anything else playing audio. Without this, listening had
      # nowhere to land and was being counted as messaging.
      "music",
      "browsing",
      "youtube",
      # HBO Max, Netflix, film & TV. Without a slot of its own this time was
      # scattered into comms/youtube/other — the DB has 'HBO Max —
      # com.wbd.stream' labelled `other` 233 times.
      "streaming",
      "twitter",
      "idle",
      "other",
    ]
    # Classification runs against llama-swap on the pc (LAN), serving a local
    # Qwen VL model on its GPU: free, private, and off any usage allowance —
    # no screenshot leaves the LAN any more. `model` and `model_text` are
    # llama-swap aliases, still picked per call by whether the batch carries
    # screenshots; both currently resolve to the same local vision model, so
    # any mix of batches is fine and the split only matters again if the two
    # aliases ever diverge.
    #
    # If this ever points back at a hosted endpoint: never use a "-free" model
    # ID there — that suffix marks the ones whose submitted data may be used
    # for training; the paid IDs are zero-retention.
    model = "time-vision"
    model_text = "time-text"
    endpoint = "http://192.168.50.232:8000/v1/chat/completions"
    # The aliases say nothing about whether the model behind them reasons, so
    # the output budget is set explicitly rather than guessed from the name.
    max_tokens_per_minute = 1600
    # llama-server compiles the label schema to a grammar, so the reply can
    # only ever be the JSON array — no fences, no prose, no think block.
    json_schema = true
    port = 7373
    idle_distance = 3
    idle_after_secs = 300
    # Batching predates the local endpoint (it was about a shared weekly
    # allowance) but is still right: the minutes share one system prompt and
    # the model sees a trajectory instead of isolated frames. With the
    # "same"-compressed output the reply no longer scales with batch size,
    # so a bigger batch is pure amortization win -- 60 is a cap, not a
    # target: batch_token_budget below closes image-dense batches long
    # before sixty screenshots.
    batch_minutes = 60
    batch_wait_secs = 600
    # A minute is not sent to the model until every in-service device has
    # reported past it. The phone reads Android's usage log in bulk, hours
    # late; classifying before it arrives showed the model a timeline with a
    # machine missing from it, and the prompt tells the model to read exactly
    # that as absence -- so real activity was being labelled as an empty room.
    #
    # Costs ~30 minutes of latency when all three devices keep up, which is
    # the normal case. 24h is the ceiling for a device that is genuinely
    # stuck: past it the minutes go out anyway, flagged to the model as an
    # incomplete timeline rather than silently pretending the device spoke.
    device_wait_hours = 24
    # tagtest and phone-test are still in this database from weeks ago.
    # Without this the frontier waits on them forever and nothing is labelled.
    device_active_hours = 72
    # Three drains a day instead of a call every ten minutes around the
    # clock. The endpoint is a GPU in a room someone sleeps in, and a call
    # every ten minutes never lets that card reach an idle clock state --
    # it also keeps llama-swap's ttl from ever expiring, so the model stays
    # resident and the fans stay up for labels nobody reads until evening.
    #
    # Nothing after 19:00 on purpose: the evening and the night are the
    # hours the noise actually cost something. The last stretch of a day is
    # labelled at 07:00 the next morning, which is well before anyone looks
    # at it. Minutes still land in the database the moment they arrive --
    # only the model calls wait -- so the only visible cost is that recent
    # minutes show the previous label carried forward until the next drain.
    classify_at = ["07:00", "13:00", "19:00"]
    # Estimated input tokens at which a batch closes early. Tied to the
    # llama-server slot size: -c 40960 --parallel 2 is two 20480-token
    # slots, and 13000 of input (~27 screenshot minutes at ~450 tokens
    # each) leaves the slot over 7000 tokens for thinking and the reply.
    # Flip to 27000 once the server runs -c 65536 (two 32k slots).
    batch_token_budget = 27000
    # Live classification keeps thinking: it is what buys the presence
    # judgment ("is a still screen reading, or an empty room?"). Flip on if
    # the GPU bill matters more.
    # thinking = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: time
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: time
  strategy:
    # SQLite on a ReadWriteOnce volume: never two writers at once.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: time
      annotations:
        # Bumping this forces a rollout. The image tag is :latest, so a config
        # or image change only reaches the pod when something in this template
        # changes — this counter is that something. There is no config-reloader
        # on the cluster, and a ConfigMap edit alone restarts nothing.
        time.erikfrankling.se/config-rev: "device-frontier-1"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: time
          image: ghcr.io/erikfrankling/time:latest
          imagePullPolicy: Always
          args: ["server"]
          env:
            # Optional: the local llama-swap endpoint takes no auth, and the
            # server runs fine without a key. Kept wired so pointing back at a
            # hosted endpoint is a config change, not a manifest change.
            - name: TIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: time-secrets
                  key: api-key
                  optional: true
            # The server pulls the Android APK from this repo's GitHub
            # releases hourly and serves it at /app, so it needs outbound
            # HTTPS to api.github.com and objects.githubusercontent.com. The
            # default is this repo; TIME_APK_PATH would pin a file instead and
            # switch fetching off.
            - name: TIME_APK_REPO
              value: ErikFrankling/time
            # Typst writes a font/package cache; without this it tries $HOME.
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: TZ
              value: Europe/Stockholm
          ports:
            - containerPort: 7373
              name: http
              protocol: TCP
          # /healthz answers from the accept loop and touches neither the
          # database nor the model. The dashboard renders in about 20ms and
          # would usually do, but "usually" is what took the route away last
          # time: a probe should report whether the process can answer, not
          # queue behind whatever else it is answering.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /config
              name: config
              readOnly: true
            # The root filesystem is read-only, but rendering a PDF means
            # writing a Typst source file and its SVGs somewhere first. A
            # tmpfs keeps that posture rather than trading it away, and the
            # scratch files are meant to be transient anyway.
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: time-data
        - name: config
          configMap:
            name: time-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: time
spec:
  selector:
    app.kubernetes.io/name: time
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
