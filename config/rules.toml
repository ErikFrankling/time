# Time's rule table. First match wins; order matters.
#
# Activities: work, study, messaging, video, feeds, browsing, music, games, other.
# Anything no rule matches is `unknown` and lands in the inbox; labelling it
# there adds a rule here. Built from the window classes, titles, hosts and
# phone packages actually seen in the v1 database (Aug-Oct 2026).
#
# Conditions in one rule must all hold; the patterns in one list are
# alternatives. `class` and `package` take `*` wildcards; `host` also matches
# subdomains; `title` is a regex. In a browser the rules mostly see the tab
# title: the extension reports the host on some browsers only.
#
# `ask_model = true` marks a last resort the decision model may overrule. It
# is asked about the tabs those rules caught, with the [profile] and the
# [[project]] descriptions at the end of this file, and its verdict
# (`model.tab`) wins over such a rule. Every other rule is final. In a browser
# Erik is almost always working or studying, so "browsing" is only for what
# nothing says anything about.

# ---------------------------------------------------------------- study
# Course codes and course tools come first, so a Claude chat or a Google Doc
# about homework counts as study rather than work.

[[rule]]
id = "study.course-title"
activity = "study"
project = "kth"
title = "(?i)\\b(IK2218|EP2120|SF1688|DD2440|DA2210|DD2395|DD2300|homework|hw[ _]?\\d|ladok|canvas|timeedit|exam|quiz|seminari|lab ?\\d|kth\\b|tentamen|grafteori|overleaf)"

[[rule]]
id = "study.course-sites"
activity = "study"
project = "kth"
host = ["kth.se", "canvas.kth.se", "ladok.se", "overleaf.com", "timeedit.net"]

# The school calendar site's tab is called "School".
[[rule]]
id = "study.school-tab"
activity = "study"
project = "kth"
class = ["firefox", "zen*", "helium", "google-chrome", "chromium*", "brave-browser"]
title = "(?i)^school( —|$)"

[[rule]]
id = "study.papers"
activity = "study"
project = "kth"
host = [
  "arxiv.org", "openreview.net", "semanticscholar.org", "scholar.google.com", "aclanthology.org",
  "paperswithcode.com", "ieeexplore.ieee.org", "dl.acm.org", "biorxiv.org", "researchgate.net",
  "jstor.org", "link.springer.com", "sciencedirect.com",
]

[[rule]]
id = "study.papers-title"
activity = "study"
project = "kth"
class = ["firefox", "zen*", "helium", "google-chrome", "chromium*", "brave-browser"]
title = "(?i)(\\barxiv\\b|\\[\\d{4}\\.\\d{4,5}(v\\d+)?\\]|openreview)"

[[rule]]
id = "study.phone-canvas"
activity = "study"
project = "kth"
package = ["com.instructure.candroid"]

# ---------------------------------------------------------------- work, first
# What Erik does for his job is work wherever it shows up, so these come
# before the video, feeds and messaging rules that would otherwise catch it.
