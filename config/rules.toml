# ---------------------------------------------------------------- profile
# For the decision model that labels browser tabs no rule settles
# (`crate::tabs` in the server). Plain sentences; keep them true.

[profile]
about = """Erik Frankling is a student at KTH in Stockholm who also works for Neptune Software on Naia Works and NaiaClaw, and runs his own company, Husk Security. Besides that he builds his own tools (a home lab, Time, T3 Code, x-graph, his NixOS dotfiles). He spends most of his waking day at the computer."""
habits = """How he uses a browser: almost everything he does in it is work or study. He researches for his job and his company (agent platforms, MCP, AI tooling and infrastructure, startups, VC and founder communities, product and docs sites, competitors, tools he might use), reads documentation, papers and homework PDFs, and uses cloud consoles. Random browsing is rare: Swedish news (DN, SvD, Aftonbladet), Wikipedia, maps, shopping, and scrolling the X home feed are the usual non-work tabs. An X post he opened is work when it is about AI, agents, developer tooling or infrastructure, startups, security, or one of his projects, because he follows that field for his job; politics, entertainment and personal posts are feeds. So when a tab could plausibly serve his job, his company, his courses or his own projects, call it work (or study for course material) with the project that fits; use browsing only for news, shopping, entertainment and pages that clearly have nothing to do with any project; use video for watching, feeds for social feeds."""
