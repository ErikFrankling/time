name: ci

# Tests only: nothing here publishes an image or a release. Those stay on
# main (image.yml, android.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The real server, for the emulator job to point the phone app at.
      - run: cargo build -p time-server
      - uses: actions/upload-artifact@v4
        with:
          name: time-server
          path: target/debug/time-server

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests (including the OTLP contract with the server)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: time-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # Install on a real emulator, open both screens, and fail on any crash.
  emulator:
    needs: [android, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: time-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: time-server
          path: server
      - name: Start the Time server
        run: |
          chmod +x server/time-server
          mkdir -p /tmp/time-data
          printf 'data_dir = "/tmp/time-data"\nlisten = "0.0.0.0:7373"\n[devices.phone]\nkind = "phone"\n' > /tmp/time.toml
          nohup server/time-server serve /tmp/time.toml > /tmp/time-server.log 2>&1 &
          sleep 2; curl -sf http://127.0.0.1:7373/healthz
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # 35+: Android enforces edge to edge, like Erik's phone.
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Audio on (the default adds -noaudio): the smoke test plays a tone
          # and checks the phone reports it as audible.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: android/scripts/emulator-smoke.sh apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: shots/
