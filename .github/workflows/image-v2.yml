name: image-v2

# The v2 server image: ghcr.io/<owner>/time:v2 (moving) and :v2-<sha>
# (pinned, what the homelab manifest deploys). v1's image.yml keeps
# publishing :latest from legacy/ as the rollback target.
on:
  push:
    branches: [main, v2]
    paths: ["crates/**", "config/**", "fixtures/**", "Cargo.toml", "Cargo.lock", "Dockerfile.v2", ".github/workflows/image-v2.yml"]
  workflow_dispatch:

concurrency:
  group: image-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/time
          tags: |
            type=raw,value=v2
            type=sha,prefix=v2-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.v2
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=v2
          cache-to: type=gha,mode=max,scope=v2
