[workspace]
resolver = "2"
members = ["crates/time-core", "crates/time-server", "crates/time-agent", "crates/time-sim"]
# v1 stays buildable on its own until v2 replaces it in production (M4).
exclude = ["legacy"]

[workspace.package]
edition = "2021"
version = "2.0.0-dev"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5"] }
time-core = { path = "crates/time-core" }
time-server = { path = "crates/time-server" }
time-agent = { path = "crates/time-agent" }

[profile.release]
opt-level = 2
